name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          mkdir -p $HOME/theos/sdks
          cd $HOME/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git t
          mv t/*.sdk . 2>/dev/null || true
          rm -rf t
          ls -d $HOME/theos/sdks/*.sdk

      - name: Build Package
        run: |
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
          if-no-files-found: warn
